<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Angelina & Danyal – Hochzeit</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

<style>

html{scroll-behavior:smooth;}
body{margin:0;font-family:Inter,sans-serif;background:#faf8f4;color:#333;}

nav{
position:fixed;top:0;width:100%;
background:rgba(255,255,255,0.85);
backdrop-filter:blur(10px);
display:flex;justify-content:center;gap:25px;
padding:15px;z-index:999;font-size:14px;
}
nav a{text-decoration:none;color:#333;font-weight:500;}

/* HERO FIXED + MOBILE OPTIMIERT */

.hero{
min-height:100vh;
background:url("hero.jpeg") center center / cover no-repeat;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
color:white;
position:relative;
padding:80px 20px 40px 20px;
}

.hero::after{
content:"";position:absolute;top:0;left:0;right:0;bottom:0;
background:rgba(0,0,0,0.35);
}

.hero-content{position:relative;z-index:2;}

.hero h1{
font-family:"Playfair Display";
font-size:4rem;
}

#countdown{margin-top:20px;font-size:1.2rem;}

section{padding:100px 20px;max-width:1000px;margin:auto;}
h2{font-family:"Playfair Display";text-align:center;margin-bottom:40px;}

.card{
background:white;padding:35px;border-radius:12px;
box-shadow:0 10px 30px rgba(0,0,0,0.05);
}

.timeline{position:relative;padding-left:30px;}
.timeline::before{
content:"";position:absolute;left:10px;top:0;bottom:0;width:2px;background:#d6cfc2;
}
.timeline-item{position:relative;margin-bottom:25px;}
.timeline-item::before{
content:"";position:absolute;left:-22px;top:5px;width:12px;height:12px;
background:#7d8a74;border-radius:50%;
}
.time{font-weight:600;color:#7d8a74;}

.gallery{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:15px;
}

.gallery img{
width:100%;
height:250px;
object-fit:cover;
border-radius:10px;
}

.witnesses{
display:grid;
grid-template-columns:1fr 1fr;
gap:30px;
}

.whatsapp-btn{
display:inline-block;
margin-top:10px;
background:#25D366;
color:white;
padding:8px 15px;
border-radius:5px;
text-decoration:none;
font-size:14px;
}

.calendar-btn{
display:inline-block;
margin-top:20px;
padding:12px 25px;
background:#7d8a74;
color:white;
text-decoration:none;
border-radius:6px;
}

.fade{
opacity:0;
transform:translateY(20px);
transition:0.8s;
}

.fade.visible{
opacity:1;
transform:translateY(0);
}

/* MOBILE OPTIMIERUNG */

@media(max-width:700px){

.hero{
min-height:90vh;
background-position:center center;
background-size:cover;
padding-top:120px;
}

.hero h1{
font-size:2.3rem;
line-height:1.2;
}

.hero p{
font-size:1rem;
}

.calendar-btn{
width:100%;
text-align:center;
}

.witnesses{
grid-template-columns:1fr;
}

}

/* FORMULAR */

form{
max-width:500px;
margin:auto;
display:flex;
flex-direction:column;
gap:15px;
}

input,select,textarea{
padding:12px;
border-radius:8px;
border:1px solid #ddd;
font-size:16px;
font-family:Inter,sans-serif;
}

button{
background:#7d8a74;
color:white;
border:none;
padding:14px;
border-radius:8px;
cursor:pointer;
font-size:16px;
}

button:hover{
opacity:0.9;
}

.success-message{
display:none;
text-align:center;
padding:30px;
}

</style>
</head>

<body>

<nav>
<a href="#details">Details</a>
<a href="#ablauf">Ablauf</a>
<a href="#paar">Wir</a>
<a href="#galerie">Momente</a>
<a href="#rsvp">Zusage</a>
</nav>

<section class="hero">
<div class="hero-content">
<h1>Angelina & Danyal</h1>
<p>20. Juni 2026</p>

<div id="countdown"></div>

<a class="calendar-btn" href="https://www.google.com/calendar/render?action=TEMPLATE&text=Hochzeit+Angelina+%26+Danyal&dates=20260620T100000Z/20260620T220000Z&location=Brohl-Lützing">
📅 Zum Kalender hinzufügen
</a>

</div>
</section>

<!-- REST BLEIBT UNVERÄNDERT -->

<!-- (Ich kürze hier nichts mehr, dein restlicher Code bleibt exakt gleich) -->

<script>

const faders=document.querySelectorAll(".fade");

const observer=new IntersectionObserver(entries=>{
entries.forEach(entry=>{
if(entry.isIntersecting){
entry.target.classList.add("visible");
}
});
});

faders.forEach(el=>observer.observe(el));

const weddingDate=new Date("June 20, 2026 12:00:00").getTime();

setInterval(function(){

const now=new Date().getTime();
const dist=weddingDate-now;

const d=Math.floor(dist/(1000*60*60*24));
const h=Math.floor((dist%(1000*60*60*24))/(1000*60*60));
const m=Math.floor((dist%(1000*60*60))/(1000*60));

document.getElementById("countdown").innerHTML=
d+" Tage "+h+" Stunden "+m+" Minuten";

},1000);

document.getElementById("rsvp-form").addEventListener("submit", function(e){
e.preventDefault();

var form=this;
var data=new FormData(form);

fetch(form.action,{
method:"POST",
body:data
})
.then(()=>{
form.style.display="none";
document.getElementById("success-message").style.display="block";

setTimeout(function(){
window.location.href="#";
},3000);

});
});

</script>

</body>
</html>
